name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake libexpat1-dev libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev pkg-config libwayland-dev libdbus-1-dev \
            libinput-dev libssl-dev libudev-dev
      - name: Build release binary
        run: cargo build --release
      - name: Install cargo-deb
        run: cargo install cargo-deb
      - name: Build .deb package
        run: cargo deb
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/cosmic-applet-rotation
            target/debian/*.deb

  flatpak:
    name: Flatpak Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Generate Flatpak Cargo sources
        run: |
          pip install aiohttp toml
          curl -sL -o flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/nickvdyck/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o flatpak/generated-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/com.github.armaaar.CosmicAppletRotation.yml
          bundle: cosmic-applet-rotation.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Attach Flatpak to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cosmic-applet-rotation.flatpak
