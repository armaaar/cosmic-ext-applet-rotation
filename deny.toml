[advisories]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "GPL-3.0",
    "GPL-3.0-only",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
]
confidence-threshold = 0.8

# COSMIC ecosystem crates that lack license metadata in their Cargo.toml
[[licenses.clarify]]
name = "cosmic-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
name = "cosmic-config-derive"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
name = "cosmic-panel-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
name = "cosmic-settings-daemon"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
name = "cosmic-theme"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
name = "xdg-shell-wrapper-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
name = "dnd"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "iced_accessibility"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "mime"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/pop-os/libcosmic"]
